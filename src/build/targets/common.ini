[optimisation_level]
minimal = -Oz
debug = -Og
default = -Os
fast = -O2
faster = -O3
fastest = -Ofast
highway_to_hell = -Ofast -funroll-loops

[c_cpp_standard]
deprecated = 
    -std=gnu11
    -std=gnu++11
stable =
    -std=gnu17
    -std=gnu++17
latest =
    -std=gnu23
    -std=gnu++23

[os_usb_port]
linux = /dev/ttyACM0
macos = ; Currently not yet supported.
windows = COM3 ; Replace with the COM port your development board is connected to.

[usb_port]
selected = ${os_usb_port.linux}

[build]
; all = ; Intentionally left blank to allow PlatformIO to build fucking everything.
; commonly_used =
verified_targets =
    development

[common]
build_flags =
    ${c_cpp_standard.stable}
    ${optimisation_level.fastest}
build_flags_development =
    ${c_cpp_standard.stable}
    ${optimisation_level.debug}
build_unflags =
    ${c_cpp_standard.deprecated}
    ${optimisation_level.default}
check_flags =
    clangtidy:--checks=bugprone-*,cert-*,clang-analyzer-*,clang-diagnostic-*,cppcoreguidelines-*,hicpp-*,misc-*,modernize-*,performance-*,portability-*,readability-*
    cppcheck:-I /workspaces/CRSFforArduino/.pio/core/packages/framework-arduino-samd-adafruit/cores/arduino --enable=all --language=c++ --platform=native --std=c++17 --suppress=*:/workspaces/CRSFforArduino/src/gsl/* --suppress=unmatchedSuppression:/workspaces/CRSFforArduino/src/gsl/*
check_severity = low, medium, high
check_src_filters =
    -<src/*>
    +<src/main.cpp>
    +<src/CRSFforArduino.cpp>
    +<src/serial_receiver_interface/serial_receiver_interface.cpp>
check_tool = clangtidy, cppcheck

[env]
build_src_filter =
    -<../src/*>
    +<../src/main.cpp>
    +<../src/CRSFforArduino.cpp>
    +<../src/serial_receiver_interface/serial_receiver_interface.cpp>
framework = arduino

[env_common_samd51]
platform = atmelsam@8.2.0
platform_packages =
    platformio/framework-arduino-samd-adafruit@1.10716.0
    platformio/framework-cmsis@2.50400.181126
    platformio/toolchain-gccarmnoneeabi@1.90301.200702
    platformio/tool-clangtidy@1.190100.0
    platformio/tool-cppcheck@1.21100.230717
upload_protocol = sam-ba
upload_port = ${usb_port.selected}
