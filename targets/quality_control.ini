[env:defect_detector]
board = adafruit_metro_m4
build_src_filter = 
    +<../examples/platformio/main.cpp>
    +<*/*/*.cpp>
    +<*.cpp>
build_type = debug
check_flags =
    --disable=unusedFunction
check_severity = low ; , medium, high
check_skip_packages = yes
check_tool = cppcheck
extends = env_common_samd51

[build]
esp32 =
    adafruit_qtpy_esp32
    adafruit_qtpy_esp32c3
    adafruit_qtpy_esp32s2
    adafruit_qtpy_esp32s3_nopsram
rp2040 =
    raspberrypi_pico_rp2040
samd21 =
    adafruit_feather_m0
    adafruit_metro_m0
    arduino_zero
samd51 =
    adafruit_feather_m4
    adafruit_feather_m4_can
    adafruit_grandcentral_m4
    adafruit_metro_m4
stm32 =
    adafruit_feather_f405
    stm32f103cb
    stm32f405rg
    stm32f411re
    stm32h750vb
teensy4x =
    teensy_41

all =
    ${build.esp32}
    ${build.rp2040}
    ${build.samd51}
    ${build.stm32}
    ${build.teensy4x}

commonly_used =
    adafruit_feather_m0
    adafruit_feather_m4
    adafruit_feather_m4_can
    adafruit_metro_m4
    adafruit_qtpy_esp32
    adafruit_qtpy_esp32c3
    adafruit_qtpy_esp32s2
    adafruit_qtpy_esp32s3_nopsram
    arduino_nano_rp2040_connect
    seeed_xiao_esp32c3
    seeed_xiao_esp32s3
    stm32f103cb
    stm32f405rg
    stm32f411re
    stm32h750vb
    teensy_41
